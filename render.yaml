# Render deployment blueprint — https://render.com/docs/blueprint-spec
# Commit this file and Render will auto-configure your services.

services:
  # ── Backend (Node.js + Python) ────────────────────────────────────────────
  - type: web
    name: zenin-mx6w
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Max concurrent Python helper processes (yfinance/pandas/numpy).
      # Each costs ~82MB before fetching anything, and the Node process idles
      # near 90MB. On this 512MB instance unbounded spawns caused OOM kills and
      # a 502 outage every few minutes, which is what made the uptime cron fail.
      # Raise this only alongside a larger plan.
      - key: PY_MAX_CONCURRENT
        value: "2"
      # Bounded in-memory caches. These were plain Maps whose TTL was checked
      # only on read, so expired entries were never freed and grew for the life
      # of the process — including keys built from raw user input
      # (`massive:search:<query>`), which leaked ~110MB over 50k searches and
      # caused the Render OOM restart loop. These caps bound that memory.
      - key: PROVIDER_CACHE_MAX_ENTRIES
        value: "500"
      - key: MACRO_CACHE_MAX_ENTRIES
        value: "100"
      # Hard cap on security-anomaly counters. Some keys embed the client IP,
      # which is attacker-controlled, so this map also needs a bound.
      - key: SECURITY_ANOMALY_MAX_KEYS
        value: "2000"
      - key: FRONTEND_URL
        value: https://www.zenin.capital
      - key: FRONTEND_URLS
        value: https://www.zenin.capital,https://zenin.capital,https://zenin-beta.vercel.app
      - key: DATABASE_URL
        sync: false
      # Supabase envs removed: authentication is now backend-managed. If you
      # migrate from Supabase, set any required direct DB URLs in DATABASE_URL.
      - key: PGSSLMODE
        value: require
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: EODHD_API_TOKEN
        sync: false
      - key: AUTH_HASH_KEY
        generateValue: true
      - key: ENABLE_DEV_AUTH_DEBUG
        value: "false"
      - key: ENABLE_OAUTH_MOCK
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@zenin.app
      # Mailbox that receives admin-console sign-in codes. Must match the
      # recipient the backend resolves at request time; the account itself is
      # auto-provisioned as an admin by initializeDatabase.
      - key: ADMIN_LOGIN_EMAIL
        value: kamama@zenin.capital
      - key: ADMIN_MIGRATION_KEY
        sync: false
      # ── SnapTrade brokerage (Connect brokerage) ─────────────────────────────
      # The provider registers ONLY when CLIENT_ID and CONSUMER_KEY are present,
      # and the brokerage routes additionally require ENABLED=true. Without all
      # three, /api/brokerage/providers returns available:false and the UI shows
      # "Brokerage not available yet" — the Connect brokerage button looks dead.
      #
      # THESE MUST BE SET ON RENDER, ON THE zenin-mx6w SERVICE. The browser calls
      # https://zenin-mx6w.onrender.com/api directly, so this process is the only
      # one that reads them. A key placed on Vercel, or on the database host, is
      # never consulted by the brokerage code path and has no effect.
      #
      # Verify at any time (booleans only, never secret values):
      #   curl -s https://zenin-mx6w.onrender.com/health/details
      # Expect integrations.snaptrade: {"configuredKeys":true,"enabled":true,"ready":true}
      #
      # Watch out for a single var named SNAPTRADE holding a masked blob — that
      # matches neither name below and silently does nothing.
      - key: SNAPTRADE_CLIENT_ID
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
      - key: SNAPTRADE_SECRET
        sync: false
      - key: SNAPTRADE_ENABLED
        value: "true"
      # Optional: restrict the pilot to specific workspace ids (comma-separated).
      # Empty means "open pilot" — every workspace may connect a brokerage.
      - key: SNAPTRADE_PILOT_WORKSPACES
        value: ""
      # "production" (default) or "sandbox".
      - key: SNAPTRADE_ENVIRONMENT
        value: production
      # Where SnapTrade returns the operator after the hosted portal.
      - key: SNAPTRADE_CALLBACK_URL
        value: https://www.zenin.capital/app?section=portfolio
      # Sentry — error monitoring / performance / release tracking.
      # DSN + project/org are non-secret; auth token is secret (sync: false).
      - key: SENTRY_BACKEND_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_BACKEND_PROJECT
        sync: false
      - key: SENTRY_BACKEND_AUTH_TOKEN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0.1"
      # Continuous CPU profiling is opt-in. It loads a native sampler that costs
      # ~275ms of boot and measurable steady-state CPU on a single-CPU instance,
      # so it is off unless explicitly enabled. Error reporting and tracing are
      # unaffected. Set to "true" temporarily when investigating a hot path.
      - key: SENTRY_PROFILING_ENABLED
        value: "false"

  # ── Frontend (React / Vite static site) ───────────────────────────────────
  - type: web
    name: zenin-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Frontend no longer requires VITE_SUPABASE_* variables. Use `VITE_API_URL`
      # to point the client at the backend API if needed during builds.
      - key: VITE_API_URL
        value: https://zenin-mx6w.onrender.com/api
    routes:
      # Send all routes to index.html so React Router / client-side nav works
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Cache hashed assets forever; never cache the HTML shell
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache

  # ── Admin Console (React / Vite static site) ──────────────────────────────
  - type: web
    name: zenin-admin
    runtime: static
    plan: free
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Perps Benchmark Runner (Background Worker) ────────────────────────────
  # Measures perps order submission latency across venues. In dry_run mode
  # (default), probes venue HTTP endpoints for network-floor baseline — no
  # funded accounts needed. Set PERPS_BENCH_MODE=live and enable venues via
  # the admin toggle endpoint to submit real post-only orders.
  - type: worker
    name: zenin-perps-bench
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: node perps-bench-runner.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: PERPS_BENCH_ENABLED
        value: "true"
      - key: PERPS_BENCH_MODE
        value: dry_run
      - key: PERPS_BENCH_RATE_MS
        value: "60000"
