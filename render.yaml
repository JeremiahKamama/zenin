# Render deployment blueprint — https://render.com/docs/blueprint-spec
# Commit this file and Render will auto-configure your services.

services:
  # ── Backend (Node.js + Python) ────────────────────────────────────────────
  - type: web
    name: portv1-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://zenin-beta.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_DIRECT_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: EODHD_API_TOKEN
        sync: false
      - key: AUTH_HASH_KEY
        generateValue: true
      - key: ENABLE_DEV_AUTH_DEBUG
        value: "false"
      - key: ENABLE_OAUTH_MOCK
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@zenin.app
      - key: ADMIN_MIGRATION_KEY
        sync: false

  # ── Frontend (React / Vite static site) ───────────────────────────────────
  - type: web
    name: portv1-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      # Send all routes to index.html so React Router / client-side nav works
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Cache hashed assets forever; never cache the HTML shell
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache

  # ── Admin Console (React / Vite static site) ──────────────────────────────
  - type: web
    name: portv1-admin
    runtime: static
    plan: free
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
