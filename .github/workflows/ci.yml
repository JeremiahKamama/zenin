name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pin Node so CI matches the deploy image (node:20-bookworm-slim) and the
      # backend's declared engine constraint (>=20). Without this, CI silently
      # uses whatever version the runner ships, which can drift from production.
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9521f10076b87b85cbcaf6025ccc70a # v4.0.3
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            admin/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # When SENTRY secrets are present (main branch), the vite plugin
          # uploads sourcemaps during the build. On PRs without secrets, the
          # plugin is skipped and sourcemaps stay local only.
          VITE_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_FRONTEND_AUTH_TOKEN }}
          VITE_SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          VITE_SENTRY_FRONTEND_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
          VITE_SENTRY_ENVIRONMENT: production
        run: npm run build

      # Create a Sentry release for the backend, linked to this commit.
      # No-op when SENTRY_BACKEND_AUTH_TOKEN is absent (PRs / forks).
      - name: Create backend Sentry release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          SENTRY_BACKEND_AUTH_TOKEN: ${{ secrets.SENTRY_BACKEND_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_BACKEND_PROJECT: ${{ secrets.SENTRY_BACKEND_PROJECT }}
          SENTRY_ENVIRONMENT: production
        run: node scripts/sentry-release.mjs

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Build admin
        working-directory: admin
        run: npm run build

      - name: Install root dependencies
        run: npm ci

      - name: Audit dependencies (root + workspaces)
        run: |
          npm audit --omit=dev || true
          (cd backend && npm audit --omit=dev) || true
          (cd frontend && npm audit --omit=dev) || true
          (cd admin && npm audit --omit=dev) || true
