    <title>Zenin Capital | Portfolio Tracker, Stock Research, Options Analysis, and Tax Estimator</title>
    <script>
      (function () {
        var path = String(window.location.pathname || "/").toLowerCase();
        var isAuth = path.indexOf("/auth") === 0;
        var isApp = path.indexOf("/app") === 0;
        var siteUrl = "https://www.zenin.capital";
        var entry = isAuth ? "auth" : isApp ? "app" : "public";
        var robots = entry === "public"
          ? "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
          : "noindex, nofollow, noarchive";
        var title = "Zenin Capital | Portfolio Tracker, Stock Research, Options Analysis, and Tax Estimator";
        if (entry === "auth") title = "Zenin Capital | Sign In, Sign Up, and Account Security";
        if (entry === "app") title = "Zenin Capital App | Trading Dashboard";

        var robotsMeta = document.querySelector('meta[name="robots"]');
        if (robotsMeta) robotsMeta.setAttribute("content", robots);

        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) {
          canonical.setAttribute("href", siteUrl + (entry === "public" ? "/" : path));
        }

        document.title = title;
        window.__ZENIN_ENTRY__ = entry;
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Zenin Capital",
        "url": "https://www.zenin.capital/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Zenin Capital is a multi-asset market intelligence platform for portfolio tracking, stock research, options analysis, prediction-market monitoring, and tax estimation.",
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter",
            "price": "0",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "29",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Desk",
            "price": "99",
            "priceCurrency": "USD"
          }
        ],
        "featureList": [
          "Portfolio tracking",
          "Stock research",
          "Options analysis",
          "Prediction-market monitoring",
          "Tax estimation"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.__ZENIN_ENTRY__ && window.__ZENIN_ENTRY__ !== "public") {
        var root = document.getElementById("root");
        if (root) root.innerHTML = "";
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
