    <title>Zenin Capital | Portfolio Tracker, Stock Research, Options Analysis, and Tax Estimator</title>
    <style>
      :root {
        color-scheme: dark;
        /* Monochrome Brand v2 tokens for the boot shell */
        --zc-bg: #0A0A0A;
        --zc-panel: rgba(17, 17, 17, 0.9);
        --zc-border: rgba(255, 255, 255, 0.06);
        --zc-text: #FFFFFF;
        --zc-muted: #A3A3A3;
        --zc-accent: #FFFFFF;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        /* Replace cyan/purple hero with a restrained monochrome ramp */
        background:
          linear-gradient(180deg, #0A0A0A 0%, #030305 100%);
        color: var(--zc-text);
        font-family: "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .zenin-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .zenin-boot-card {
        width: min(420px, 100%);
        padding: 28px 26px;
        border-radius: 24px;
        border: 1px solid var(--zc-border);
        background: var(--zc-panel);
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.45);
        backdrop-filter: blur(18px);
      }

      .zenin-boot-brand {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #cdd8ec;
      }

      .zenin-boot-title {
        margin: 14px 0 8px;
        font-size: clamp(28px, 5vw, 38px);
        line-height: 1.05;
        font-weight: 700;
      }

      .zenin-boot-copy {
        margin: 0;
        color: var(--zc-muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .zenin-boot-progress {
        position: relative;
        overflow: hidden;
        height: 10px;
        margin-top: 18px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.14);
      }

      .zenin-boot-progress::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: var(--zc-accent);
        animation: zeninBootLoad 1.05s ease-in-out infinite;
      }

      @keyframes zeninBootLoad {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="zenin-boot">
        <div class="zenin-boot-card">
          <div class="zenin-boot-brand">Zenin Capital</div>
          <h1 class="zenin-boot-title" data-zenin-boot-title>Loading Zenin</h1>
          <p class="zenin-boot-copy" data-zenin-boot-copy>Initializing portfolios, watchlists, market data, and your workspace.</p>
          <div class="zenin-boot-progress" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <template id="zenin-public-prerender"></template>
    <script>
      // Route-aware boot copy — runs before the JS bundle loads so the
      // first flash matches the route the user actually opened.
      (function () {
        try {
          var path = window.location.pathname || "/";
          var search = window.location.search || "";
          var isApp = path.indexOf("/app") === 0;
          var isAuth = path.indexOf("/auth") === 0;
          var isGuest = /[?&]guest=(1|true|yes)\b/i.test(search);
          var titleEl = document.querySelector("[data-zenin-boot-title]");
          var copyEl = document.querySelector("[data-zenin-boot-copy]");
          if (!titleEl || !copyEl) return;
          if (isApp && isGuest) {
            titleEl.textContent = "Opening demo workspace";
            copyEl.textContent = "Loading the Zenin demo workspace so you can explore portfolios, watchlists, and research.";
          } else if (isApp) {
            titleEl.textContent = "Checking session";
            copyEl.textContent = "Verifying your Zenin session and loading your workspace.";
          } else if (isAuth) {
            titleEl.textContent = "Sign in to Zenin";
            copyEl.textContent = "Securely accessing your Zenin workspace.";
          } else {
            titleEl.textContent = "Loading Zenin";
            copyEl.textContent = "Initializing portfolios, watchlists, market data, and your workspace.";
          }
        } catch (e) {
          // no-op — fall back to the static copy
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Stale-entry recovery.
      //
      // Vite emits hashed chunks and Vercel garbage-collects superseded ones. A
      // browser holding a cached index.html therefore requests an entry bundle
      // that may already be deleted. The module script then fails to load and
      // NOTHING renders — the user is left on the boot shell above ("Checking
      // session" on /app) indefinitely, because no application code ever runs to
      // recover or explain.
      //
      // lazyWithReloadRetry() in App.jsx handles stale LAZY chunks, but it cannot
      // help when the entry chunk itself is gone: the app never boots far enough
      // to run it.
      //
      // This closes that gap. If the module fails to execute shortly after load,
      // reload once — and only once, so a genuinely broken deploy cannot trap the
      // browser in a refresh loop.
      (function () {
        var FLAG = "zenin_entry_reload_attempted";
        var ENTRY_TIMEOUT_MS = 6000;
        var booted = false;

        // main.jsx calls this as soon as React mounts.
        window.__zeninBooted = function () {
          booted = true;
          try { sessionStorage.removeItem(FLAG); } catch (e) {}
        };

        function reloadOnce(reason) {
          if (booted) return;
          try {
            if (sessionStorage.getItem(FLAG) === "1") return; // already tried
            sessionStorage.setItem(FLAG, "1");
          } catch (e) {
            return; // no sessionStorage: do not risk a reload loop
          }
          console.warn("[Zenin] Reloading to recover a stale build (" + reason + ")");
          window.location.reload();
        }

        // 1. A module script that fails to fetch or parse fires this on window.
        window.addEventListener("error", function (event) {
          var target = event && event.target;
          if (target && target.tagName === "SCRIPT") {
            reloadOnce("entry script failed to load");
          }
        }, true);

        // 2. A rejected dynamic import surfaces as an unhandled rejection.
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var message = String((reason && reason.message) || reason || "");
          if (/Failed to fetch dynamically imported module|Importing a module script failed|ChunkLoadError/i.test(message)) {
            reloadOnce("stale chunk");
          }
        });

        // 3. Nothing executed at all — the strongest signal of a dead entry.
        window.setTimeout(function () {
          if (!booted) reloadOnce("app did not start");
        }, ENTRY_TIMEOUT_MS);
      })();
    </script>
