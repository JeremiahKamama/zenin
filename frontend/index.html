<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Zenin Capital is a multi-asset market intelligence platform for portfolio tracking, stock research, options analysis, prediction-market monitoring, and tax estimation."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://www.zenin.capital/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zenin Capital" />
    <meta
      property="og:title"
      content="Zenin Capital | Portfolio Tracker, Stock Research, Options Analysis, and Tax Estimator"
    />
    <meta
      property="og:description"
      content="Track portfolios, research stocks, model options, monitor prediction markets, and estimate taxes from one unified workspace."
    />
    <meta property="og:url" content="https://www.zenin.capital/" />
    <meta property="og:image" content="https://www.zenin.capital/og/zenin-capital-home.svg" />
    <meta property="og:image:alt" content="Zenin Capital dashboard preview for portfolio tracking and market intelligence." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Zenin Capital | Portfolio Tracker, Stock Research, Options Analysis, and Tax Estimator"
    />
    <meta
      name="twitter:description"
      content="Track portfolios, research stocks, model options, monitor prediction markets, and estimate taxes from one unified workspace."
    />
    <meta name="twitter:image" content="https://www.zenin.capital/og/zenin-capital-home.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
    <title>Zenin Capital | Portfolio Tracker, Stock Research, Options Analysis, and Tax Estimator</title>
    <style>
      :root {
        color-scheme: dark;
        --zc-bg: #050816;
        --zc-panel: rgba(15, 23, 42, 0.78);
        --zc-border: rgba(148, 163, 184, 0.18);
        --zc-text: #e5eefc;
        --zc-muted: #8da2c0;
        --zc-accent: #FFFFFF;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(79, 124, 255, 0.14), transparent 36%),
          linear-gradient(180deg, #07101f 0%, var(--zc-bg) 62%, #03060f 100%);
        color: var(--zc-text);
        font-family: "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .zenin-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .zenin-boot-card {
        width: min(420px, 100%);
        padding: 28px 26px;
        border-radius: 24px;
        border: 1px solid var(--zc-border);
        background: var(--zc-panel);
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.45);
        backdrop-filter: blur(18px);
      }

      .zenin-boot-brand {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #cdd8ec;
      }

      .zenin-boot-title {
        margin: 14px 0 8px;
        font-size: clamp(28px, 5vw, 38px);
        line-height: 1.05;
        font-weight: 700;
      }

      .zenin-boot-copy {
        margin: 0;
        color: var(--zc-muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .zenin-boot-progress {
        position: relative;
        overflow: hidden;
        height: 10px;
        margin-top: 18px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.14);
      }

      .zenin-boot-progress::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: var(--zc-accent);
        animation: zeninBootLoad 1.05s ease-in-out infinite;
      }

      @keyframes zeninBootLoad {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="zenin-boot">
        <div class="zenin-boot-card">
          <div class="zenin-boot-brand">Zenin Capital</div>
          <h1 class="zenin-boot-title" data-zenin-boot-title>Loading Zenin</h1>
          <p class="zenin-boot-copy" data-zenin-boot-copy>Initializing portfolios, watchlists, market data, and your workspace.</p>
          <div class="zenin-boot-progress" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <template id="zenin-public-prerender"></template>
    <script>
      // Route-aware boot copy — runs before the JS bundle loads so the
      // first flash matches the route the user actually opened.
      (function () {
        try {
          var path = window.location.pathname || "/";
          var search = window.location.search || "";
          var isApp = path.indexOf("/app") === 0;
          var isAuth = path.indexOf("/auth") === 0;
          var isGuest = /[?&]guest=(1|true|yes)\b/i.test(search);
          var titleEl = document.querySelector("[data-zenin-boot-title]");
          var copyEl = document.querySelector("[data-zenin-boot-copy]");
          if (!titleEl || !copyEl) return;
          if (isApp && isGuest) {
            titleEl.textContent = "Opening demo workspace";
            copyEl.textContent = "Loading the Zenin demo workspace so you can explore portfolios, watchlists, and research.";
          } else if (isApp) {
            titleEl.textContent = "Checking session";
            copyEl.textContent = "Verifying your Zenin session and loading your workspace.";
          } else if (isAuth) {
            titleEl.textContent = "Sign in to Zenin";
            copyEl.textContent = "Securely accessing your Zenin workspace.";
          } else {
            titleEl.textContent = "Loading Zenin";
            copyEl.textContent = "Initializing portfolios, watchlists, market data, and your workspace.";
          }
        } catch (e) {
          // no-op — fall back to the static copy
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
